<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionVR — Detección de Objetos en AR</title>
  <meta name="description" content="Frontend WebXR para detección de objetos en realidad aumentada con Meta Quest 3">
  <!-- A-Frame: framework WebXR (Local para modo Offline) -->
  <script src="/js/aframe.min.js"></script>
  <!-- Socket.IO: cliente WebSocket (Local para modo Offline) -->
  <script src="/js/socket.io.min.js"></script>

  <style>
    /* ─── Reset ─────────────────────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* ─── Panel de configuración (Overlay Centrado Lovable) ──────────── */
    #panel-config {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: radial-gradient(circle at top left, rgba(0, 255, 136, 0.05), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(0, 255, 136, 0.05), transparent 40%),
                  #070a10; /* Very dark background */
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
      backdrop-filter: blur(10px);
    }
    
    .panel-config-card {
      background: #0f131a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 40px;
      width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Ocultar el panel */
    #panel-config.oculto {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .panel-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .panel-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    
    .panel-header h1 span {
      color: #00ff88;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: block;
      margin-top: 4px;
    }

    .panel-header p {
      color: #8b949e;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      fill: #8b949e;
    }

    #input-ip {
      width: 100%;
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 12px 12px 36px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    #input-ip:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 1px #00ff88;
    }

    #btn-conectar {
      width: 100%;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      margin-bottom: 20px;
    }

    #btn-conectar:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
      background: #00cc6a;
    }

    #btn-conectar:active {
      transform: translateY(0);
    }
    
    #btn-conectar:disabled {
      background: #333;
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .demo-toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8b949e;
      font-size: 0.9rem;
    }
    
    .demo-toggle-container svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Toggle Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #30363d;
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00ff88;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #000;
    }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff4444;
      box-shadow: 0 0 8px rgba(255, 68, 68, 0.6);
      transition: all 0.3s;
    }

    #estado {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    
    #estado.conectado {
      color: #00ff88;
    }
    #estado.error {
      color: #ff4444;
    }

    /* ─── Overlay de estadísticas (2D, visible fuera de VR) ────────────── */
    #panel-stats-2d {
      position: fixed;
      top: 80px;
      right: 16px;
      z-index: 9998;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.25);
      border-radius: 12px;
      padding: 16px;
      min-width: 220px;
      backdrop-filter: blur(8px);
      display: none;
    }

    #panel-stats-2d.visible { display: block; }

    #panel-stats-2d h3 {
      color: #00ff88;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-label { color: #888; }
    .stat-value { color: #fff; font-weight: 600; }

    /* ─── Detecciones en 2D (fuera de VR) ──────────────────────────────── */
    #detecciones-2d {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 9998;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
    }

    #detecciones-2d.visible { display: flex; }

    .tag-2d {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ═══ SECCIÓN 1: Panel de Configuración ═══════════════════════════════ -->
  <div id="panel-config">
    <div class="panel-config-card">
      <div class="panel-header">
        <h1>◲ VisionVR<br><span>Setup</span></h1>
        <p>Configure your session before entering VR.</p>
      </div>

      <div class="input-group">
        <label for="input-ip">SERVER IP ADDRESS</label>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <input type="text" id="input-ip" value="http://localhost:5000">
        </div>
      </div>

      <button id="btn-conectar" onclick="conectar()">CONNECT TO SERVER</button>

      <div class="options-row">
        <div class="demo-toggle-container">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Demo Mode
        </div>
        <label class="switch">
          <input type="checkbox" id="btn-demo-toggle" onchange="toggleModoDemo()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="status-container">
        <div id="status-dot" class="status-dot"></div>
        <span id="estado">Disconnected</span>
      </div>
    </div>
  </div>

  <!-- ═══ Panel de estadísticas 2D (fuera de VR) ═════════════════════════ -->
  <div id="panel-stats-2d">
    <h3>📊 Estadísticas</h3>
    <div class="stat-row">
      <span class="stat-label">FPS Procesamiento</span>
      <span class="stat-value" id="stat-fps">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Frames enviados</span>
      <span class="stat-value" id="stat-frames">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Objetos detectados</span>
      <span class="stat-value" id="stat-objetos">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Último tiempo</span>
      <span class="stat-value" id="stat-tiempo">— ms</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Confianza prom.</span>
      <span class="stat-value" id="stat-confianza">—</span>
    </div>
  </div>


  <!-- ═══ Tags de detecciones 2D ═════════════════════════════════════════ -->
  <div id="detecciones-2d"></div>

  <!-- ═══ SECCIÓN 2: Escena A-Frame (WebXR con passthrough) ══════════════ -->
  <a-scene
    id="escena"
    webxr="requiredFeatures: local-floor; optionalFeatures: hand-tracking, bounded-floor, depth-sensing"
    depth-reader
    renderer="colorManagement: true; physicallyCorrectLights: true"
    background="color: #0a0a0f"
    vr-mode-ui="enabled: true"
  >
    <!-- Cámara con controles básicos -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camara" look-controls wasd-controls></a-camera>
      
      <!-- Controles de Manos Nativos de Meta Quest -->
      <a-entity id="leftHand" hand-tracking-controls="hand: left" gesture-listener></a-entity>
      <a-entity id="rightHand" hand-tracking-controls="hand: right" raycaster="objects: .etiqueta-vr; showLine: true" gesture-listener></a-entity>
    </a-entity>

    <!-- Contenedor de etiquetas flotantes 3D (se llenan por JS) -->
    <a-entity id="contenedor-etiquetas" position="0 1.6 -2"></a-entity>

    <!-- Panel de estadísticas 3D (visible en VR) -->
    <a-entity
      id="panel-stats-vr"
      position="0.8 2.2 -1.5"
      rotation="0 -20 0"
      visible="false"
    >
      <a-plane
        width="0.6"
        height="0.45"
        color="#111122"
        opacity="0.85"
        side="double"
      ></a-plane>
      <a-text
        id="stats-vr-text"
        value="Estadísticas\n─────────\nEsperando datos..."
        color="#00ff88"
        width="1"
        position="0 0 0.01"
        align="center"
        font="monoid"
      ></a-text>
    </a-entity>

    <!-- Panel de Historial 3D -->
    <a-entity
      id="panel-historial-vr"
      position="-0.8 2.2 -1.5"
      rotation="0 20 0"
      visible="false"
    >
      <a-plane
        width="0.7"
        height="0.6"
        color="#111122"
        opacity="0.85"
        side="double"
      ></a-plane>
      <a-text
        id="historial-vr-text"
        value="Historial\n─────────\n..."
        color="#00d8ff"
        width="1.2"
        position="-0.3 0.2 0.01"
        align="left"
        anchor="left"
        baseline="top"
        font="monoid"
      ></a-text>
    </a-entity>

    <!-- Panel de Alerta/Error 3D (visible en VR cuando falla la red) -->
    <a-entity
      id="panel-error-vr"
      position="0 1.2 -1.2"
      visible="false"
    >
      <a-plane
        width="0.9"
        height="0.35"
        color="#330000"
        opacity="0.9"
        side="double"
      ></a-plane>
      <a-text
        id="error-vr-text"
        value="⚠️ ALERTA DE CONEXIÓN\nReintentando en 3s..."
        color="#ff4444"
        width="1.3"
        position="0 0 0.01"
        align="center"
        font="monoid"
      ></a-text>
    </a-entity>

    <!-- Panel de Alerta de Objeto Peligroso / Riesgo 3D -->
    <a-entity
      id="panel-peligro-vr"
      position="0 2.4 -1.3"
      visible="false"
    >
      <a-plane
        width="1.2"
        height="0.35"
        color="#aa0000"
        opacity="0.92"
        side="double"
      ></a-plane>
      <a-text
        id="peligro-vr-text"
        value="⚠️ PRECAUCIÓN: OBJETO DE RIESGO DETECTADO"
        color="#ffffff"
        width="1.4"
        position="0 0 0.01"
        align="center"
        font="monoid"
      ></a-text>
    </a-entity>

    <!-- Iluminación ambiental mínima -->
    <a-light type="ambient" color="#fff" intensity="0.6"></a-light>


  </a-scene>

  <!-- ═══ SECCIÓN 3: Script JavaScript ═══════════════════════════════════ -->
  <script>
    // ─── A-Frame: Componentes Interactivos para Manos ─────────────────────
    
    // 1. Escuchar Gestos (Pellizco)
    AFRAME.registerComponent('gesture-listener', {
      init: function () {
        this.el.addEventListener('pinchstarted', (evt) => {
          // Verificar si el raycaster está apuntando a algo
          const raycasterEl = this.el.components.raycaster;
          if (raycasterEl && raycasterEl.intersectedEls.length > 0) {
              const intersectedEl = raycasterEl.intersectedEls[0];
              const objectName = intersectedEl.dataset.objeto;
              
              if (objectName) {
                  console.log("Pellizco sobre objeto:", objectName);
                  hablar(`Buscando información sobre ${objectName}`);
                  
                  // Llamar al backend (Groq Llama-3)
                  const url = servidorURL || document.getElementById('input-ip').value.trim().replace(/\/+$/, '');
                  fetch(`${url}/explicar`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ objeto: objectName, contexto: "laboratorio de computación" })
                  })
                  .then(res => res.json())
                  .then(data => {
                      if(data.explicacion) {
                          hablar(data.explicacion);
                      }
                  })
                  .catch(err => {
                      console.error(err);
                      hablar("Error al contactar a la inteligencia artificial.");
                  });
              }
          } else {
              console.log("Pellizco al aire detectado.");
          }
        });
      }
    });

    // 2. Comportamiento de las etiquetas al señalarlas
    AFRAME.registerComponent('etiqueta-interactiva', {
      init: function () {
        this.el.addEventListener('raycaster-intersected', evt => {
          // Ampliar al apuntar con la mano
          this.el.setAttribute('scale', '1.3 1.3 1.3');
        });
        this.el.addEventListener('raycaster-intersected-cleared', evt => {
          // Restaurar tamaño normal
          this.el.setAttribute('scale', '1 1 1');
        });
      }
    });

    // 3. Lector de Profundidad WebXR (Depth API)
    window.lastDepthInfo = null;
    AFRAME.registerComponent('depth-reader', {
      tick: function (time, timeDelta) {
        if (!this.el.is('vr-mode')) return;
        
        const frame = this.el.sceneEl.frame;
        if (!frame) return;
        
        const refSpace = this.el.sceneEl.systems.webxr.sessionReferenceSpace;
        const viewerPose = frame.getViewerPose(refSpace);
        if (!viewerPose) return;
        
        const view = viewerPose.views[0];
        if (view && frame.getDepthInformation) {
            try {
                const depthInfo = frame.getDepthInformation(view);
                if (depthInfo) {
                    window.lastDepthInfo = depthInfo;
                }
            } catch(e) {
                // Falla silenciosamente si no está disponible aún
            }
        }
      }
    });

    // ─── Estado global ────────────────────────────────────────────────────
    let servidorURL = '';
    let conectado = false;
    let intervaloCaptura = null;
    let enviando = false; // Evita enviar si el anterior no ha respondido
    let socket = null;
    let historialObjetos = []; // Almacena los últimos 10 objetos detectados
    
    // Auto-reconexión
    let timerReconexion = null;
    let reintentosReconexion = 0;

    // Modo Demo
    let modoDemo = false;
    let ultimasDeteccionesDemo = [];

    // FPS Counter
    let lastFrameTime = performance.now();
    let fpsActual = 0;

    // ─── Captura de cámara real (Fix: passthrough no se captura del canvas A-Frame) ──
    let cameraStream = null;
    let cameraVideo = null;
    let cameraCanvas = null;
    let cameraCtx = null;
    const YOLO_SIZE = 640; // Resolución de inferencia del modelo

    // Web Audio API para sonidos (Detección y Alerta de Peligro)
    let audioCtx = null;
    function reproducirSonidoDeteccion() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}
    }

    let lastPeligroTime = 0;
    function reproducirSonidoPeligro() {
      const now = performance.now();
      if (now - lastPeligroTime < 2000) return; // Cooldown 2 segundos
      lastPeligroTime = now;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    // Análisis de Escena Periódico (Llama-3 cada 15s)
    let timerAnalisisEscena = null;
    function iniciarAnalisisEscenaPeriodico() {
      if (timerAnalisisEscena) clearInterval(timerAnalisisEscena);
      timerAnalisisEscena = setInterval(() => {
        if (!conectado || modoDemo || historialObjetos.length === 0) return;
        
        const url = servidorURL || document.getElementById('input-ip').value.trim().replace(/\/+$/, '');
        fetch(`${url}/analizar_escena`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ objetos: historialObjetos.slice(0, 5) })
        })
        .then(res => res.json())
        .then(data => {
          if (data.resumen) {
            console.log("🧠 Resumen global de escena (Llama-3):", data.resumen);
          }
        })
        .catch(err => console.error("Error analizando escena:", err));
      }, 15000); // 15 segundos
    }


    // Estadísticas de sesión
    const stats = {
      framesEnviados: 0,
      totalObjetos: 0,
      ultimoTiempo: 0,
      sumaConfianza: 0,
      conteoConfianza: 0
    };

    // ─── Referencias DOM ──────────────────────────────────────────────────
    const inputIP = document.getElementById('input-ip');
    const btnConectar = document.getElementById('btn-conectar');
    const elEstado = document.getElementById('estado');
    const panelConfig = document.getElementById('panel-config');
    const panelStats2D = document.getElementById('panel-stats-2d');
    const detecciones2D = document.getElementById('detecciones-2d');
    const panelErrorVR = document.getElementById('panel-error-vr');

    // ─── Modo Demo Toggle ────────────────────────────────────────────────
    function toggleModoDemo() {
      modoDemo = document.getElementById('btn-demo-toggle').checked;
      if (modoDemo) {
        mostrarEstado('Demo Mode Active', 'conectado');
      } else {
        if (conectado) mostrarEstado('Connected', 'conectado');
        else mostrarEstado('Disconnected', '');
      }
    }

    // ─── Ocultar panel al entrar/salir de VR ──────────────────────────────
    const escena = document.getElementById('escena');

    escena.addEventListener('enter-vr', () => {
      document.getElementById('panel-stats-vr').setAttribute('visible', 'true');
      document.getElementById('panel-historial-vr').setAttribute('visible', 'true');
      const capaUI = document.getElementById('capa-ui');
      if (capaUI) capaUI.style.display = 'none';
      panelConfig.classList.add('oculto');
      panelStats2D.classList.remove('visible');
      detecciones2D.classList.remove('visible');
    });

    escena.addEventListener('exit-vr', () => {
      panelConfig.classList.remove('oculto');
      if (conectado) {
        panelStats2D.classList.add('visible');
        detecciones2D.classList.add('visible');
      }
      document.getElementById('panel-stats-vr').setAttribute('visible', 'false');
    });

    // ─── Conectar al servidor con Auto-Reconexión ─────────────────────────
    async function conectar() {
      servidorURL = inputIP.value.trim().replace(/\/+$/, '');

      if (!servidorURL) {
        mostrarEstado('⚠ Escribe la IP del servidor', 'error');
        return;
      }

      btnConectar.disabled = true;
      mostrarEstado('⏳ Conectando...', '');

      try {
        const resp = await fetch(`${servidorURL}/ping`, {
          method: 'GET',
          signal: AbortSignal.timeout(5000)
        });
        const data = await resp.json();

        if (data.status === 'ok') {
          if (!socket) {
            socket = io(servidorURL, { 
                reconnection: true, 
                reconnectionDelay: 3000,
                extraHeaders: { "Bypass-Tunnel-Reminder": "true" }
            });
            registrarListenersSocket();
          } else {
            socket.connect();
          }

        } else {
          mostrarEstado('✗ Respuesta inesperada del servidor', 'error');
          manejarDesconexion('Respuesta inesperada');
        }
      } catch (err) {
        console.error('Error de conexión:', err);
        mostrarEstado('✗ No se pudo conectar — reintentando...', 'error');
        manejarDesconexion('Fallo al conectar');
      }

      btnConectar.disabled = false;
    }

    function registrarListenersSocket() {
      socket.on('connect', () => {
        conectado = true;
        mostrarEstado('✓ Conectado — iniciando detección', 'conectado');
        if (panelErrorVR) panelErrorVR.setAttribute('visible', 'false');

        panelStats2D.classList.add('visible');
        detecciones2D.classList.add('visible');

        hablar('Sistema VisionVR activado');
        iniciarCaptura();
        iniciarAnalisisEscenaPeriodico();
      });

      socket.on('connect_error', (err) => {
        console.error('Error de Socket.IO:', err);
        manejarDesconexion('Error de red');
      });

      socket.on('disconnect', () => {
        manejarDesconexion('Desconectado del servidor');
      });

      socket.on('detecciones_resultado', (data) => {
        enviando = false;
        if (data.error) {
          console.error('Error del servidor:', data.error);
          return;
        }

        // Calcular FPS
        const now = performance.now();
        fpsActual = Math.round(1000 / Math.max(1, (now - lastFrameTime)));
        lastFrameTime = now;

        stats.framesEnviados++;
        stats.ultimoTiempo = data.tiempo_ms || 0;
        stats.totalObjetos += data.total || 0;

        if (!modoDemo) {
          ultimasDeteccionesDemo = data.detecciones || [];
          procesarDetecciones(ultimasDeteccionesDemo);
        }

        actualizarEstadisticas();
      });
    }

    function manejarDesconexion(motivo) {
      conectado = false;
      mostrarEstado(`⚠️ ${motivo} — Reintentando en 3s...`, 'error');
      if (panelErrorVR) panelErrorVR.setAttribute('visible', 'true');
      
      if (timerReconexion) clearTimeout(timerReconexion);
      timerReconexion = setTimeout(() => {
        if (!conectado && !modoDemo) {
          reintentosReconexion++;
          console.log(`Reintento de conexión #${reintentosReconexion}...`);
          conectar();
        }
      }, 3000);
    }


    // ─── Mostrar estado en el badge ───────────────────────────────────────
    function mostrarEstado(texto, clase) {
      elEstado.textContent = texto;
      elEstado.className = clase || '';
      const dot = document.getElementById('status-dot');
      if (dot) {
          if (clase === 'conectado') {
              dot.style.backgroundColor = '#00ff88';
              dot.style.boxShadow = '0 0 8px rgba(0, 255, 136, 0.6)';
          } else if (clase === 'error') {
              dot.style.backgroundColor = '#ff4444';
              dot.style.boxShadow = '0 0 8px rgba(255, 68, 68, 0.6)';
          } else {
              if (texto.includes('Conectando') || texto.includes('Connecting')) {
                  dot.style.backgroundColor = '#ffcc00';
                  dot.style.boxShadow = '0 0 8px rgba(255, 204, 0, 0.6)';
              } else {
                  dot.style.backgroundColor = '#ff4444';
                  dot.style.boxShadow = '0 0 8px rgba(255, 68, 68, 0.6)';
              }
          }
      }
    }

    // ─── Captura de frames ────────────────────────────────────────────────
    async function iniciarCaptura() {
      if (intervaloCaptura) clearInterval(intervaloCaptura);

      // Intentar abrir la cámara real del dispositivo (passthrough del Quest)
      // El canvas de A-Frame solo renderiza la escena 3D, NO captura el passthrough.
      if (!cameraStream) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
          });
          cameraVideo = document.createElement('video');
          cameraVideo.srcObject = cameraStream;
          cameraVideo.setAttribute('playsinline', '');
          cameraVideo.muted = true;
          await cameraVideo.play();

          cameraCanvas = document.createElement('canvas');
          cameraCtx = cameraCanvas.getContext('2d');
          console.log('📷 Cámara real activada para captura de frames');
        } catch (err) {
          console.warn('⚠️ No se pudo acceder a la cámara real, usando canvas A-Frame como fallback:', err.message);
          cameraStream = null;
        }
      }

      intervaloCaptura = setInterval(() => {
        if (!conectado || enviando) return;
        capturarYEnviar();
      }, 200); // 5 FPS
    }

    function capturarYEnviar() {
      if (!socket || !socket.connected) {
          enviando = false;
          return;
      }
      enviando = true;

      try {
        let base64;

        if (cameraVideo && cameraVideo.readyState >= 2 && cameraCanvas) {
          // Usar la cámara real del dispositivo (passthrough)
          cameraCanvas.width = cameraVideo.videoWidth;
          cameraCanvas.height = cameraVideo.videoHeight;
          cameraCtx.drawImage(cameraVideo, 0, 0);
          base64 = cameraCanvas.toDataURL('image/jpeg', 0.7);
        } else {
          // Fallback: capturar del canvas A-Frame (funciona en escritorio)
          const canvas = escena.canvas;
          if (!canvas) {
            enviando = false;
            return;
          }
          base64 = canvas.toDataURL('image/jpeg', 0.7);
        }

        socket.emit("detectar", { imagen: base64 });

      } catch (err) {
        console.error('Error enviando frame:', err);
        enviando = false;
      }
    }

    // ─── Procesar detecciones ─────────────────────────────────────────────
    function procesarDetecciones(detecciones) {
      const panelPeligroVR = document.getElementById('panel-peligro-vr');

      if (detecciones.length === 0) {
          limpiarEtiquetas();
          if (panelPeligroVR) panelPeligroVR.setAttribute('visible', 'false');
          return;
      }

      const idsDetectados = new Set();
      let hayPeligro = false;

      // Actualizar o crear etiquetas
      detecciones.forEach((det, i) => {
        const uid = det.id_track != null ? `track-${det.id_track}` : `temp-${i}-${det.objeto}`;
        idsDetectados.add(uid);
        
        actualizarOCrearEtiqueta3D(det, uid, i, detecciones.length);
        
        stats.sumaConfianza += det.confianza;
        stats.conteoConfianza++;
        
        if (det.peligro) {
          hayPeligro = true;
          reproducirSonidoPeligro();
        }

        if (historialObjetos.length === 0 || historialObjetos[0] !== det.objeto) {
            historialObjetos.unshift(det.objeto);
            if (historialObjetos.length > 8) historialObjetos.pop();
            if (!det.peligro) reproducirSonidoDeteccion();
        }
      });

      if (panelPeligroVR) {
        panelPeligroVR.setAttribute('visible', hayPeligro ? 'true' : 'false');
      }

      actualizarHistorial();
      limpiarEtiquetasViejas(idsDetectados);
      
      detecciones2D.innerHTML = '';
      detecciones.forEach(det => crearEtiqueta2D(det));
    }


    function limpiarEtiquetasViejas(idsActivos) {
        const contenedor = document.getElementById('contenedor-etiquetas');
        if (!contenedor) return;
        Array.from(contenedor.children).forEach(hijo => {
            if (!idsActivos.has(hijo.id)) {
                contenedor.removeChild(hijo);
            }
        });
    }

    // ─── Actualizar o Crear etiqueta flotante 3D ────────────────
    function actualizarOCrearEtiqueta3D(deteccion, uid, indice, total) {
      const contenedor = document.getElementById('contenedor-etiquetas');
      if (!contenedor) return;

      const { objeto, confianza } = deteccion;
      const color = colorPorConfianza(confianza);
      const porcentaje = Math.round(confianza * 100);

      let x = 0, y = 0, z = 0;
      if (deteccion.bbox) {
        const cx = deteccion.bbox.x + deteccion.bbox.w / 2;
        const cy = deteccion.bbox.y + deteccion.bbox.h / 2;
        // Fix #2: Usar YOLO_SIZE (640) en vez de window dimensions.
        // YOLO siempre infiere a 640x640, las coordenadas bbox están en ese espacio.
        const ndcX = (cx / YOLO_SIZE) * 2 - 1;
        const ndcY = -((cy / YOLO_SIZE) * 2 - 1);
        x = ndcX * 2.5; 
        y = ndcY * 1.5; 
        z = -2; // Default si no hay lectura de profundidad

        // Si tenemos datos del sensor LiDAR/Infrarrojo del Meta Quest:
        if (window.lastDepthInfo) {
            try {
                const depthW = window.lastDepthInfo.width;
                const depthH = window.lastDepthInfo.height;
                // Mapear coordenadas YOLO (640x640) al espacio del depth sensor
                const dX = Math.floor((cx / YOLO_SIZE) * depthW);
                const dY = Math.floor((cy / YOLO_SIZE) * depthH);
                
                if (dX >= 0 && dX < depthW && dY >= 0 && dY < depthH) {
                    const profMts = window.lastDepthInfo.getDepthInMeters(dX, dY);
                    // Validar que la lectura sea razonable (entre 10 cm y 10 metros)
                    if (profMts > 0.1 && profMts < 10) {
                        z = -profMts;
                        // Ajustar X e Y basado en la nueva profundidad por trigonometría simple
                        x = ndcX * profMts * 1.25; 
                        y = ndcY * profMts * 0.75;
                    }
                }
            } catch(e) {
                // Fallback silencioso a z = -2
            }
        }
      } else {
        const angulo = ((indice - (total - 1) / 2) * 0.4);
        x = Math.sin(angulo) * 2;
        y = 0.2 - (indice * 0.35);
        z = 0;
      }

      // Verificar si la entidad ya existe
      let entidad = document.getElementById(uid);
      
      if (entidad) {
          // Animación suave a la nueva posición
          entidad.setAttribute('animation__mov', `property: position; to: ${x} ${y} ${z}; dur: 200; easing: linear`);
          
          // Actualizar texto y color (por si cambia confianza)
          const textoEl = entidad.querySelector('a-text');
          if(textoEl) {
              textoEl.setAttribute('value', `${objeto.toUpperCase()}  ${porcentaje}%`);
              textoEl.setAttribute('color', color);
          }
          const barraEl = entidad.querySelectorAll('a-plane')[1];
          if(barraEl) {
              barraEl.setAttribute('color', color);
          }
      } else {
          // Si no existe, crearla desde cero
          entidad = document.createElement('a-entity');
          entidad.id = uid;
          entidad.dataset.objeto = objeto; // Guardamos el nombre para el gesto pinch
          entidad.classList.add('etiqueta-vr');
          entidad.setAttribute('position', `${x} ${y} ${z}`);
          entidad.setAttribute('look-at', '[camera]');
          entidad.setAttribute('etiqueta-interactiva', '');

          // Fondo
          const fondo = document.createElement('a-plane');
          fondo.setAttribute('width', '0.8');
          fondo.setAttribute('height', '0.18');
          fondo.setAttribute('color', '#111122');
          fondo.setAttribute('opacity', '0.88');
          fondo.setAttribute('side', 'double');

          // Barra
          const barra = document.createElement('a-plane');
          barra.setAttribute('width', '0.03');
          barra.setAttribute('height', '0.18');
          barra.setAttribute('color', color);
          barra.setAttribute('position', '-0.385 0 0.001');
          barra.setAttribute('side', 'double');

          // Texto
          const texto = document.createElement('a-text');
          texto.setAttribute('value', `${objeto.toUpperCase()}  ${porcentaje}%`);
          texto.setAttribute('color', color);
          texto.setAttribute('width', '1.5');
          texto.setAttribute('position', '-0.33 0 0.002');
          texto.setAttribute('align', 'left');

          entidad.appendChild(fondo);
          entidad.appendChild(barra);
          entidad.appendChild(texto);

          // Animación de entrada
          entidad.setAttribute('scale', '0 0 0');
          entidad.setAttribute('animation__scale', {
            property: 'scale',
            to: '1 1 1',
            dur: 300,
            easing: 'easeOutBack'
          });

          contenedor.appendChild(entidad);
      }
    }

    // ─── Crear etiqueta 2D (fuera de VR) ──────────────────────────────────
    function crearEtiqueta2D(deteccion) {
      const { objeto, confianza } = deteccion;
      const color = colorPorConfianza(confianza);
      const porcentaje = Math.round(confianza * 100);

      const tag = document.createElement('div');
      tag.className = 'tag-2d';
      tag.textContent = `${objeto} — ${porcentaje}%`;
      tag.style.background = `${color}22`;
      tag.style.color = color;
      tag.style.border = `1px solid ${color}`;

      detecciones2D.appendChild(tag);
    }

    // ─── Limpiar etiquetas ────────────────────────────────────────────────
    function limpiarEtiquetas() {
      // 3D
      const contenedor = document.getElementById('contenedor-etiquetas');
      if (contenedor) {
        while (contenedor.firstChild) {
          contenedor.removeChild(contenedor.firstChild);
        }
      }
      // 2D
      detecciones2D.innerHTML = '';
    }

    // ─── Color según nivel de confianza ───────────────────────────────────
    function colorPorConfianza(confianza) {
      if (confianza >= 0.75) return '#00ff88'; // Verde — alta
      if (confianza >= 0.50) return '#ffcc00'; // Amarillo — media
      return '#ff4444';                         // Rojo — baja
    }

    // ─── Actualizar paneles de estadísticas ───────────────────────────────
    function actualizarEstadisticas() {
      const promConfianza = stats.conteoConfianza > 0
        ? (stats.sumaConfianza / stats.conteoConfianza * 100).toFixed(1)
        : '—';

      // Panel 2D
      const statFpsEl = document.getElementById('stat-fps');
      if (statFpsEl) statFpsEl.textContent = fpsActual;
      document.getElementById('stat-frames').textContent = stats.framesEnviados;
      document.getElementById('stat-objetos').textContent = stats.totalObjetos;
      document.getElementById('stat-tiempo').textContent = `${stats.ultimoTiempo} ms`;
      document.getElementById('stat-confianza').textContent =
        promConfianza !== '—' ? `${promConfianza}%` : '—';

      // Panel 3D (en VR)
      const statsVRText = document.getElementById('stats-vr-text');
      if (statsVRText) {
        statsVRText.setAttribute('value',
          `Estadísticas\n` +
          `─────────────\n` +
          `FPS:     ${fpsActual}\n` +
          `Frames:  ${stats.framesEnviados}\n` +
          `Objetos: ${stats.totalObjetos}\n` +
          `Tiempo:  ${stats.ultimoTiempo} ms\n` +
          `Conf:    ${promConfianza}%`
        );
      }
    }


    // ─── Actualizar Historial 3D ──────────────────────────────────────────
    function actualizarHistorial() {
        const histVRText = document.getElementById('historial-vr-text');
        if (histVRText && historialObjetos.length > 0) {
            let texto = "Historial Reciente\n──────────────────\n";
            historialObjetos.forEach((obj, i) => {
                texto += `${i + 1}. ${obj.toUpperCase()}\n`;
            });
            histVRText.setAttribute('value', texto);
        }
    }

    // ─── Síntesis de voz ──────────────────────────────────────────────────
    let vozDisponible = false;

    // Intentar activar la voz después de la primera interacción
    document.addEventListener('click', () => {
      if (!vozDisponible) {
        vozDisponible = true;
        // Hacer un utterance silencioso para desbloquear
        const u = new SpeechSynthesisUtterance('');
        u.volume = 0;
        speechSynthesis.speak(u);
      }
    }, { once: false });

    function hablar(texto) {
      if (!('speechSynthesis' in window)) {
        console.warn('SpeechSynthesis no disponible');
        return;
      }

      // Cancelar cualquier utterance anterior para no acumular cola
      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.rate = 1.1;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      // Intentar usar una voz en español
      const voces = speechSynthesis.getVoices();
      const vozES = voces.find(v => v.lang.startsWith('es'));
      if (vozES) utterance.voice = vozES;

      speechSynthesis.speak(utterance);
    }

    // Precargar voces (algunos navegadores las cargan async)
    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    // ─── Permitir conectar con Enter ──────────────────────────────────────
    inputIP.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') conectar();
    });

    // ─── Look-at component (para que las etiquetas miren a la cámara) ─────
    AFRAME.registerComponent('look-at', {
      schema: { type: 'selector' },
      tick: function () {
        const target = this.data ? document.querySelector(this.data) : null;
        if (target) {
          const targetPos = target.object3D.getWorldPosition(new THREE.Vector3());
          this.el.object3D.lookAt(targetPos);
        }
      }
    });

    console.log('VisionVR Frontend cargado — esperando conexión');

    // ─── Service Worker para Modo Offline ─────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ Service Worker registrado para Modo Offline:', reg.scope))
          .catch(err => console.log('❌ Error al registrar Service Worker:', err));
      });
    }

  </script>
